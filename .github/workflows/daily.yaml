name: Daily update

on:
  schedule:
    - cron: "17 6 * * *"   # morning run
    - cron: "17 14 * * *"  # backup run, in case the first is skipped or data is late
  workflow_dispatch:

permissions:
  contents: read           # this job only reads the code, never writes to the repo

concurrency:
  group: daily-update      # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked --no-dev

      - name: Check Hugging Face login
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run hf auth whoami

      - name: Update pageviews
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m wiki_forecast.pipeline update