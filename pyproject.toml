[project]
name = "wiki-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Doruk Karaman", email = "dorukkaraman2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "pandas>=2.3.3",
    "prophet>=1.5.0",
    "pyarrow>=21.0.0",
    "requests>=2.32.5",
    "scikit-learn>=1.9.1",
    "statsforecast>=2.0.1",
]

[project.scripts]
wiki-forecast = "wiki_forecast:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
]
